<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VSL da aula do YouTube: conferência</title>
<style>
:root{--tinta:#0B0D12;--tinta2:#475467;--azul:#2F5BFF;--gelo:#FAFBFD;--linha:#D9DEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--gelo);color:var(--tinta);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
main{max-width:420px;margin:0 auto}
h1{font-size:20px;line-height:1.2;margin:0 0 4px;letter-spacing:-.02em}
p{font-size:14px;line-height:1.45;color:var(--tinta2);margin:0 0 14px}
.abas{display:flex;gap:8px;margin:0 0 12px}
.abas button{flex:1;border:1px solid var(--linha);background:#fff;color:var(--tinta);border-radius:14px;padding:12px 8px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;line-height:1.2}
.abas button small{display:block;font-weight:500;font-size:12px;color:var(--tinta2);margin-top:2px}
.abas button[aria-pressed=true]{background:var(--azul);border-color:var(--azul);color:#fff}
.abas button[aria-pressed=true] small{color:#fff}
.quadro{position:relative;padding-top:177.78%;background:#06060a;border-radius:18px;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#06060a}
.linha{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.linha span{font-size:13px;color:var(--tinta2);margin-right:4px}
.linha button{border:1px solid var(--linha);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--tinta)}
.linha button[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}
#aviso{margin-top:12px;font-size:13px;color:#B42318;display:none}
</style>
</head>
<body>
<main>
<h1>VSL da aula do YouTube</h1>
<p>Página só de conferência, fora do funil. As duas versões estão a 1,14× na aula e 1× na oferta. Sem legenda.</p>
<div class="abas" role="group" aria-label="Versão">
<button type="button" data-v="cortada" aria-pressed="true">Cortada<small>39:47</small></button>
<button type="button" data-v="integral" aria-pressed="false">Integral<small>45:33</small></button>
</div>
<div class="quadro"><video id="v" controls playsinline preload="metadata"></video></div>
<div class="linha" role="group" aria-label="Velocidade do player"><span>Velocidade do player</span>
<button type="button" data-r="1" aria-pressed="true">1×</button>
<button type="button" data-r="1.25" aria-pressed="false">1,25×</button>
<button type="button" data-r="1.5" aria-pressed="false">1,5×</button>
</div>
<div id="aviso">Este vídeo ainda não subiu. Tenta de novo em alguns minutos.</div>
</main>
<script>
(function(){
var BASE='https://media.srv1198551.hstgr.cloud/fluency-yt-rmkt/vsl-yt-',FIM='-1411.mp4';
var v=document.getElementById('v'),aviso=document.getElementById('aviso'),atual='';
function ler(k){try{return localStorage.getItem(k)}catch(e){return null}}
function gravar(k,x){try{localStorage.setItem(k,x)}catch(e){}}
function marcar(sel,attr,val){[].forEach.call(document.querySelectorAll(sel),function(b){b.setAttribute('aria-pressed',b.getAttribute(attr)===val?'true':'false')})}
function trocar(nome){
  if(atual){gravar('vslyt_pos_'+atual,String(v.currentTime||0))}
  atual=nome;aviso.style.display='none';marcar('.abas button','data-v',nome);gravar('vslyt_versao',nome);
  var taxa=v.playbackRate||1;v.src=BASE+nome+FIM;v.load();
  v.addEventListener('loadedmetadata',function um(){v.removeEventListener('loadedmetadata',um);var p=parseFloat(ler('vslyt_pos_'+nome)||'0');if(p>5&&p<v.duration-10)v.currentTime=p;v.playbackRate=taxa});
}
v.addEventListener('error',function(){aviso.style.display='block'});
v.addEventListener('timeupdate',function(){if(atual&&Math.floor(v.currentTime)%5===0)gravar('vslyt_pos_'+atual,String(v.currentTime))});
[].forEach.call(document.querySelectorAll('.abas button'),function(b){b.addEventListener('click',function(){trocar(b.getAttribute('data-v'))})});
[].forEach.call(document.querySelectorAll('.linha button'),function(b){b.addEventListener('click',function(){v.playbackRate=parseFloat(b.getAttribute('data-r'));marcar('.linha button','data-r',b.getAttribute('data-r'))})});
trocar(ler('vslyt_versao')==='integral'?'integral':'cortada');
})();
</script>
</body>
</html>
